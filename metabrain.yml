# Hummingbot's run contract (FEAT-1304). See
# ~/Documents/metabrain/docs/projects-manifest.example.yml for the full field
# reference; this file declares only what the repo already has.
#
# This is the open-source trading client itself, not a daemon: `make run`
# drops a human into the interactive `hummingbot_quickstart.py` TUI
# (password prompt, strategy config, live order management against whatever
# exchange keys are in conf/), and `make deploy`'s docker-compose.yml CMDs
# the same TUI into a container meant to be `docker attach`ed to, not probed
# over HTTP. There is no port, no HTTP endpoint and no headless/background
# mode by default — `client` below is the "repo's own tooling runs it" shape
# (FEAT-289) only in the sense that metabrain gives it a tmux window to live
# in so a human can attach and drive it; there is nothing to healthcheck and
# nothing for a workstream to preview a second live copy of (same reasoning
# as Duma's `web` and rfq-maker's `bots`: a second instance would be a second
# live trading client against the same or a second set of real exchange
# keys, which is a product decision, not an infra one).
#
# No `deploy.env`: this repo is the client developers run on their own
# machine or VPS by hand; it has no server side for `deploy_contract` to
# judge.

name: hummingbot

services:
  # Absolute interpreter path into this checkout's own uv-managed venv, not a bare
  # `python`/`uv run`: the shared tmux server on this Mac carries a PATH whose
  # resolution order isn't guaranteed per window, so naming the venv explicitly
  # sidesteps that lookup entirely.
  - name: client
    command: .venv/bin/python ./bin/hummingbot_quickstart.py
