# Cloud deployment compose for humm.kline007.top.
# The public domain is handled by the host Nginx. The optional read-only admin
# profile binds to localhost and must not be exposed without proxy auth and TLS.

services:
  hummingbot:
    container_name: hummingbot
    image: ${HUMMINGBOT_IMAGE:-hummingbot/hummingbot:latest}
    restart: unless-stopped
    tty: true
    stdin_open: true
    network_mode: host
    environment:
      - CONFIG_PASSWORD=${CONFIG_PASSWORD:-}
      - CONFIG_FILE_NAME=${CONFIG_FILE_NAME:-}
      - SCRIPT_CONFIG=${SCRIPT_CONFIG:-}
      - HEADLESS_MODE=${HEADLESS_MODE:-false}
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
      - ALL_PROXY=${ALL_PROXY:-}
      - NO_PROXY=${NO_PROXY:-}
      - http_proxy=${http_proxy:-}
      - https_proxy=${https_proxy:-}
      - all_proxy=${all_proxy:-}
      - no_proxy=${no_proxy:-}
    volumes:
      - ./conf:/home/hummingbot/conf
      - ./conf/connectors:/home/hummingbot/conf/connectors
      - ./conf/strategies:/home/hummingbot/conf/strategies
      - ./conf/controllers:/home/hummingbot/conf/controllers
      - ./conf/scripts:/home/hummingbot/conf/scripts
      - ./logs:/home/hummingbot/logs
      - ./data:/home/hummingbot/data
      - ./certs:/home/hummingbot/certs
      - ./scripts:/home/hummingbot/scripts
      - ./controllers:/home/hummingbot/controllers
      - ./hummingbot/strategy_v2/routers:/home/hummingbot/hummingbot/strategy_v2/routers
      - ./hummingbot/strategy_v2/executors/executor_base.py:/home/hummingbot/hummingbot/strategy_v2/executors/executor_base.py
      - ./hummingbot/strategy_v2/executors/grid_executor/grid_executor.py:/home/hummingbot/hummingbot/strategy_v2/executors/grid_executor/grid_executor.py
      - ./hummingbot/strategy_v2/executors/order_executor/order_executor.py:/home/hummingbot/hummingbot/strategy_v2/executors/order_executor/order_executor.py
      - ./hummingbot/strategy_v2/executors/position_executor/position_executor.py:/home/hummingbot/hummingbot/strategy_v2/executors/position_executor/position_executor.py
      - ./hummingbot/core/web_assistant/connections/connections_factory.py:/home/hummingbot/hummingbot/core/web_assistant/connections/connections_factory.py
      - ./hummingbot/connector/exchange/binance/binance_constants.py:/home/hummingbot/hummingbot/connector/exchange/binance/binance_constants.py
      - ./hummingbot/connector/exchange/binance/binance_web_utils.py:/home/hummingbot/hummingbot/connector/exchange/binance/binance_web_utils.py
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  gateway:
    profiles: ["gateway"]
    container_name: hummingbot-gateway
    image: ${HUMMINGBOT_GATEWAY_IMAGE:-hummingbot/gateway:latest}
    restart: unless-stopped
    ports:
      - "127.0.0.1:15888:15888"
    volumes:
      - ./gateway-files/conf:/home/gateway/conf
      - ./gateway-files/logs:/home/gateway/logs
      - ./certs:/home/gateway/certs
    environment:
      - GATEWAY_PASSPHRASE=${GATEWAY_PASSPHRASE:-admin}
      - DEV=${GATEWAY_DEV:-true}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  admin:
    profiles: ["admin"]
    container_name: hummingbot-ai-admin
    build:
      context: ./admin
    image: ${HUMMINGBOT_ADMIN_IMAGE:-hummingbot-admin}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3217:3217"
    environment:
      - HUMMINGBOT_ROOT=/workspace
    volumes:
      - ./:/workspace:ro
      - ./data:/workspace/data
      - ./conf/runtime:/workspace/conf/runtime
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3217/admin/api/routing"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  strategy-router:
    profiles: ["admin"]
    container_name: hummingbot-strategy-router
    image: ${HUMMINGBOT_ADMIN_IMAGE:-hummingbot-admin}
    restart: unless-stopped
    working_dir: /workspace
    command: ["python3", "scripts/strategy_router_daemon.py"]
    environment:
      - STRATEGY_ROUTER_APPLY_WORKERS=0
    volumes:
      - ./:/workspace:ro
      - ./data:/workspace/data
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python3", "scripts/check_strategy_router_health.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
