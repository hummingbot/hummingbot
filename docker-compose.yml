services:
  hummingbot:
    container_name: hummingbot
    image: kairos/hummingbot:latest
    # build: # Uncomment this build section and comment image to build Hummingbot locally
    #   context: .
    #   dockerfile: Dockerfile
    volumes:
      - ./conf:/home/kairos/conf
      - ./conf/connectors:/home/kairos/conf/connectors
      - ./conf/strategies:/home/kairos/conf/strategies
      - ./conf/controllers:/home/kairos/conf/controllers
      - ./conf/scripts:/home/kairos/conf/scripts
      - ./logs:/home/kairos/logs
      - ./data:/home/kairos/data
      - ./certs:/home/kairos/certs
      - ./scripts:/home/kairos/scripts
      - ./controllers:/home/kairos/controllers
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    tty: true
    stdin_open: true
    network_mode: host
    # init: true runs a real init (tini) as PID 1 so it REAPS exited children — needed when a bot is
    # started with `docker exec … hbot start`: it reparents to PID 1 when the exec returns, and without
    # an init it lingers as a zombie that makes `hbot stop` wait its full timeout. Harmless otherwise.
    init: true
    # By default the container runs the interactive Hummingbot client — `docker attach hummingbot`.
    # To drive the container with `hbot` commands instead (`make link-cli`, then `hbot <command>`, or
    # `docker exec -it hummingbot hbot <command>`), run it as an idle "hbot host" — uncomment:
    #   command: tail -f /dev/null
    # Or make one dedicated bot the container's main process:
    #   command: hbot start <config> --foreground
  #  environment:
  #    - HBOT_PASSWORD=admin

  gateway:
   profiles: ["gateway"]
   restart: always
   container_name: gateway
   image: kairos/gateway:latest
   ports:
     - "15888:15888"
   volumes:
     - "./gateway-files/conf:/home/gateway/conf"
     - "./gateway-files/logs:/home/gateway/logs"
     - "./certs:/home/gateway/certs"
   environment:
     - GATEWAY_PASSPHRASE=admin
     - DEV=true
